<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تعديل</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--input:#f1f5f9;--primary:#0f766e;--primary2:#14b8a6;}
body.dark{--bg:#020617;--card:#0f172a;--text:#f1f5f9;--muted:#94a3b8;--border:#1e293b;--input:#1e293b;}
*{box-sizing:border-box; transition:.2s;} body{background:var(--bg); color:var(--text); font-family:system-ui; margin:0; padding:20px;}
.container{max-width:600px; margin:auto;} .card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px;}
input,textarea{width:100%; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:11px; color:var(--text); font-family:inherit; margin-bottom:10px;}
.colors{display:flex; gap:8px; margin:10px 0;} .color-dot{width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent;} .color-dot.active{border-color:var(--text); transform:scale(1.15);}
.btn-main{width:100%; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; cursor:pointer;}
.btn-icon{position:fixed; top:18px; left:18px; background:var(--card); border:1px solid var(--border); width:40px; height:40px; border-radius:12px; cursor:pointer;}
</style>
</head>
<body>
<button class="btn-icon" id="darkToggle">🌙</button>
<div class="container">
  <div class="card">
    <h3>تعديل الملاحظة</h3>
    <form method="POST" id="editForm">
      {% set n_title = note[1] %}{% set n_content = note[2] %}{% set n_color = note[5] if note[5] else '#ffffff' %}{% set n_cat = note[6] if note[6] else '' %}
      <input type="text" name="title" value="{{ n_title }}" required>
      <textarea name="content" required style="min-height:100px;">{{ n_content }}</textarea>
      <input type="text" name="category" value="{{ n_cat }}" placeholder="التصنيف">
      <div style="font-size:12px; color:var(--muted); margin-top:8px;">اللون الحالي: {{ n_color }}</div>
      <div class="colors">
        <div class="color-dot" data-color="#ffffff" style="background:#ffffff; border:1px solid #ddd;"></div>
        <div class="color-dot" data-color="#fef3c7" style="background:#fef3c7;"></div>
        <div class="color-dot" data-color="#dcfce7" style="background:#dcfce7;"></div>
        <div class="color-dot" data-color="#dbeafe" style="background:#dbeafe;"></div>
        <div class="color-dot" data-color="#fce7f3" style="background:#fce7f3;"></div>
        <div class="color-dot" data-color="#ffedd5" style="background:#ffedd5;"></div>
      </div>
      <input type="hidden" name="color" id="selectedColor" value="{{ n_color }}">
      <button class="btn-main">💾 حفظ التعديل</button>
    </form>
    <a href="/" style="display:block; text-align:center; margin-top:12px; color:var(--muted); text-decoration:none; font-size:13px;">رجوع</a>
  </div>
</div>
<script>
const body=document.body, btn=document.getElementById('darkToggle');
const saved=localStorage.getItem('theme'); if(saved=='dark'){body.classList.add('dark'); btn.textContent='☀️';}
btn.onclick=()=>{body.classList.toggle('dark'); const d=body.classList.contains('dark'); btn.textContent=d?'☀️':'🌙'; localStorage.setItem('theme',d?'dark':'light');};
const currentColor=document.getElementById('selectedColor').value;
document.querySelectorAll('.color-dot').forEach(dot=>{
  if(dot.dataset.color.toLowerCase()===currentColor.toLowerCase()) dot.classList.add('active');
  dot.onclick=()=>{
    document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
    dot.classList.add('active');
    document.getElementById('selectedColor').value=dot.dataset.color;
  }
});
</script>
</body>
</html>
