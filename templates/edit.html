<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="UTF-8"><title>تعديل</title>
<style>body{font-family:sans-serif; max-width:600px; margin:50px auto;} input,textarea{width:100%; padding:10px; margin:5px 0;} button{padding:10px 20px; background:#2d6a4f; color:white; border:none;}</style>
</head>
<body>
    <h1>تعديل الملاحظة ✏️</h1>
    <form method="POST">
        <input type="text" name="title" value="{{ note['title'] }}" required>
        <textarea name="content">{{ note['content'] }}</textarea>
        <button type="submit">تحديث</button>
        <a href="/" style="margin-right:10px;">إلغاء</a>
    </form>
</body>
</html>
