<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظاتي</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:20px} .card{background:#1e293b;padding:12px;margin:8px 0;border-radius:8px} .btn{background:#3b82f6;color:#fff;padding:8px 12px;border:none;border-radius:5px;margin:3px;cursor:pointer} input,textarea{width:100%;padding:10px;margin:5px 0;border-radius:5px;background:#0f172a;color:#fff;border:1px solid #334155}</style>
</head>
<body>
<h2>اهلا {{ username }} 👋</h2>
<p><a href="/debug" style="color:#60a5fa;">Debug</a> | <a href="/logout" style="color:#60a5fa;">خروج</a> | <a href="/clear-notes" style="color:#f87171;">مسح الملاحظات</a></p>
<form method="POST" action="/add" style="background:#1e293b;padding:15px;border-radius:10px;margin-bottom:15px;">
<input name="title" placeholder="عنوان الملاحظة" required>
<textarea name="content" placeholder="المحتوى" rows="2"></textarea>
<button class="btn" type="submit">+ حفظ</button>
</form>
<h3>ملاحظاتك ({{ notes|length }})</h3>
{% for note in notes %}
<div class="card">
<b>{{ note[1] }}</b><br>{{ note[2] }}<br>
<small style="opacity:0.5">{{ note[6] }}</small><br>
<form method="POST" action="/delete/{{ note[0] }}" style="display:inline;"><button class="btn" style="background:#ef4444;">حذف</button></form>
<a href="/edit/{{ note[0] }}"><button class="btn">تعديل</button></a>
</div>
{% else %}
<p style="opacity:0.5;text-align:center;">لا توجد ملاحظات - اضف اول واحدة!</p>
{% endfor %}
<hr><p style="font-size:12px;opacity:0.4;">V13 FIXED - POSTGRES Persistent</p>
</body>
</html>
