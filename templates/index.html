<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر ملاحظاتي</title>
<style>
body{font-family:sans-serif;background:#f4f5f7;padding:20px;max-width:700px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
  <div>👋 أهلا يا <b>{{ username }}</b></div>
  <a href="/logout" style="color:#e74c3c;text-decoration:none">خروج</a>
</div>
<h1>📝 دفتر ملاحظاتي</h1>

<div style="display:flex; gap:8px; margin-bottom:16px;">
  <input id="searchBox" autocomplete="off" placeholder="🔍 ابحث في ملاحظاتك... اكتب تغير مثلا" oninput="doSearch()" style="flex:1; padding:12px; border:2px solid #222; border-radius:10px;">
</div>

<div class="card">
<form action="/add" method="POST">
  <input name="title" placeholder="عنوان الملاحظة" required>
  <textarea name="content" placeholder="اكتب هنا..." rows="3" required></textarea>
  <button style="width:100%;background:#145a4a;color:white;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:6px">حفظ</button>
</form>
</div>

<p><b id="countText">{{ notes|length }} ملاحظات</b></p>

<div id="notesList">
{% for note in notes %}
<div class="card note-item">
  <h3 style="margin:0">{{ note[1] }}</h3>
  <p style="margin:8px 0;color:#444">{{ note[2] }}</p>
  <small style="color:#999">{{ note[4] }}</small>
  <div style="display:flex; gap:6px; margin-top:10px;">
    <form action="/pin/{{ note[0] }}" method="POST" style="margin:0"><button style="background:#eee;border:none;padding:6px 12px;border-radius:6px">تثبيت</button></form>
    <a href="/edit/{{ note[0] }}" style="background:#f1c40f;color:#333;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px">تعديل</a>
    <form action="/delete/{{ note[0] }}" method="POST" style="margin:0"><button style="background:#e74c3c;color:white;border:none;padding:6px 12px;border-radius:6px">حذف</button></form>
  </div>
</div>
{% endfor %}
</div>

<script>
function doSearch(){
  let q = document.getElementById('searchBox').value.toLowerCase().trim();
  let cards = document.querySelectorAll('.note-item');
  let visible = 0;
  cards.forEach(card => {
    let text = card.innerText.toLowerCase();
    let match = text.includes(q);
    card.style.display = match? '' : 'none';
    if(match) visible++;
  });
  document.getElementById('countText').innerText = visible + ' ملاحظات';
}
</script>
</body>
</html>
