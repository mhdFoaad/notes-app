<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر ملاحظاتي</title>
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --input:#f1f5f9; --primary:#0f766e; --primary2:#14b8a6;
  --shadow:0 10px 25px -5px rgba(0,0,0,.05);
}
body.dark{
  --bg:#020617; --card:#0f172a; --text:#f1f5f9; --muted:#94a3b8;
  --border:#1e293b; --input:#1e293b; --shadow:0 10px 25px -5px rgba(0,0,0,.4);
}
*{transition: background.3s, color.3s, border.3s;}
body{background:var(--bg); color:var(--text); font-family:'Cairo',system-ui; margin:0; padding:20px;}
.container{max-width:720px; margin:auto;}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.logo{font-weight:800; font-size:22px; display:flex; gap:8px; align-items:center;}
.actions{display:flex; gap:10px; align-items:center;}
.btn-icon{background:var(--card); border:1px solid var(--border); width:42px; height:42px; border-radius:12px; cursor:pointer; font-size:18px; box-shadow:var(--shadow);}
.card{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
input, textarea{width:100%; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text); box-sizing:border-box; font-family:inherit;}
textarea{min-height:80px; resize:vertical; margin-top:10px;}
.btn-main{width:100%; margin-top:12px; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:white; border:none; padding:13px; border-radius:12px; font-weight:700; cursor:pointer; font-size:15px;}
.note-title{font-weight:700; font-size:16px; margin-bottom:6px;}
.note-content{color:var(--muted); font-size:14px; line-height:1.6;}
.note-footer{display:flex; gap:8px; margin-top:12px; justify-content:flex-end;}
.btn-mini{border:none; padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer;}
.btn-pin{background:var(--input); color:var(--text);}.btn-edit{background:#f59e0b; color:white;}.btn-del{background:#ef4444; color:white;}
.search{position:relative;}.search span{position:absolute; left:14px; top:50%; transform:translateY(-50%);}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">📝 دفتر ملاحظاتي</div>
    <div class="actions">
      <button class="btn-icon" id="darkToggle">🌙</button>
      <span style="font-size:13px;">أهلا يا {{ username }} ✨</span>
      <a href="/logout" style="color:var(--muted); text-decoration:none; font-size:13px;">خروج</a>
    </div>
  </div>

  <div class="card search">
    <input type="text" id="searchInput" placeholder="ابحث في أفكارك..." style="padding-left:40px;">
    <span>🔍</span>
  </div>

  <div class="card">
    <form action="/add" method="POST">
      <input type="text" name="title" placeholder="عنوان عبقري..." required>
      <textarea name="content" placeholder="اكتب فكرتك هنا..." required></textarea>
      <button class="btn-main">✨ حفظ الملاحظة</button>
    </form>
  </div>

  <div style="text-align:left; color:var(--muted); font-size:13px; margin:10px 5px;">{{ notes|length }} ملاحظات</div>

  {% for note in notes %}
  <div class="card note-card" data-title="{{ note[1]|lower }} {{ note[2]|lower }}">
    <div class="note-title">{% if note[4]==1 %}📌{% endif %} {{ note[1] }}</div>
    <div class="note-content">{{ note[2] }}</div>
    <div class="note-footer">
      <form action="/pin/{{ note[0] }}" method="POST"><button class="btn-mini btn-pin">{% if note[4]==1 %}إلغاء تثبيت{% else %}تثبيت{% endif %}</button></form>
      <a href="/edit/{{ note[0] }}"><button class="btn-mini btn-edit">تعديل</button></a>
      <form action="/delete/{{ note[0] }}" method="POST"><button class="btn-mini btn-del">حذف</button></form>
    </div>
  </div>
  {% endfor %}
</div>

<script>
// دارك مود
const body = document.body;
const btn = document.getElementById('darkToggle');
const saved = localStorage.getItem('theme');
if(saved=='dark'){ body.classList.add('dark'); btn.textContent='☀️'; }
btn.onclick = ()=>{
  body.classList.toggle('dark');
  const isDark = body.classList.contains('dark');
  btn.textContent = isDark? '☀️' : '🌙';
  localStorage.setItem('theme', isDark? 'dark' : 'light');
}
// بحث لحظي
document.getElementById('searchInput').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.note-card').forEach(c=>{
    c.style.display = c.dataset.title.includes(q)? 'block' : 'none';
  })
})
</script>
</body>
</html>
